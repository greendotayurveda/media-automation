version: "3.8"
services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    networks:
      - media_network
    ports:
      - 8096:8096   # optional, for direct access
    volumes:
      - /media/jellyfin/config:/config
      - /media/jellyfin/cache:/cache
      - /opt/media-platform/data/library/:/media
      # Netflix-like theme (paste into Dashboard Custom CSS, or run apply-theme.sh)
      - ./custom.css:/config/custom-css/netflix.css:ro
    restart: unless-stopped
    environment:
      - TZ=Asia/Kolkata

networks:
  media_network:
    external: true
